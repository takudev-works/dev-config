name: Dev env review (reusable)

on:
  workflow_call:
    secrets:
      ORG_CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  dev-env-review:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # persist-credentials: false にしないのは、Claude が branch を push するため
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: # zizmor: ignore[artipacked]
          fetch-depth: 1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.ORG_CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            この repo の開発環境と文書を見直し、直したほうがよいものを PR で提案してください。

            1. node_modules/@takudev-works/dev-config/README.md の「開発環境と文書の見直し」を読み、見るものと見ないものを確かめる
            2. この repo の README、CLAUDE.md、mise.toml、package.json、lefthook.yml、スクリプト、.github/workflows を読み、基準に当てはまるものを洗い出す。根拠として、ファイルと行を控える
            3. ラベル dev-env-review の付いた PR を `gh pr list --label dev-env-review --state all` で確かめる。閉じたまま merge されなかった PR にある提案は、断られたものとして出し直さない
            4. 候補があれば、branch を切って直し、`pnpm run validate` が通ることを確かめてから PR を出す。PR にはラベル dev-env-review を付ける（無ければ `gh label create dev-env-review` で作る）。ラベル dev-env-review の付いた PR が開いていれば、新しく作らずに、その PR の branch に足す。本文には、候補ごとの理由と根拠、確かめられなかったことを分けて書く
            5. 候補がなければ PR を作らず、見たファイルと「提案なし」を報告して終える

            既定の branch に直接 push しない。
          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh pr:*),Bash(gh label:*),Bash(pnpm run validate:*)"
