name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    uses: ./.github/workflows/reusable-claude.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
