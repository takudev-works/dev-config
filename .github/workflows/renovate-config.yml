name: Renovate config

# 毎回は回さない。renovate-config-validator は依存が大きく、検査するのは Renovate の設定ファイルだけなので。
# paths で動くかが決まるので、必須の check にはしない（関係ない PR で check が出ず merge できなくなる）
on:
  pull_request:
    paths:
      - 'src/renovate.json'
      - 'renovate.json'
      - '.github/workflows/renovate-config.yml'
  push:
    branches: [main]
    paths:
      - 'src/renovate.json'
      - 'renovate.json'
      - '.github/workflows/renovate-config.yml'

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.164.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          install_args: bun
      - run: bunx --package "renovate@$RENOVATE_VERSION" renovate-config-validator src/renovate.json renovate.json
