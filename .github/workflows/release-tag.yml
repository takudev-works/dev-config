name: Release tag

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  tag:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: package.json の版のタグとリリースが無ければ作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag はもうある"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 "$GITHUB_SHA")
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --generate-notes --notes-start-tag "$previous"
          echo "$tag を $GITHUB_SHA に打ち、$previous からの変更をリリースに書いた"
