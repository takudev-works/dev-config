name: Release tag

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  tag:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: package.json の版のタグが無ければ打つ
        run: |
          tag="v$(jq -r .version package.json)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag はもうある"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "$tag を $GITHUB_SHA に打った"
