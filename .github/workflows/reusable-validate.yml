name: validate (reusable)

on:
  workflow_call:

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 0 を数値で書かないのは、式の中では 0 が偽になり、常に 1 になるため
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
      - run: bun install --frozen-lockfile
      # 別の job にしないのは、check が増えると組織の ruleset に足す必要があり、新しい版に上がる前の repo の PR が止まるため
      - name: PR のタイトルとコミットメッセージを commitlint で検査する
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          config=node_modules/dev-config/dist/commitlintrc.json
          # src を探すのをやめないのは、dist の無い v5 以前の dev-config を入れている repo が呼ぶため
          [ -f "$config" ] || config=node_modules/dev-config/src/commitlintrc.json
          [ -f "$config" ] || config=dist/commitlintrc.json
          printf '%s\n' "$PR_TITLE" | bun commitlint --config "$config"
          bun commitlint --config "$config" --from "$BASE_SHA" --to "$HEAD_SHA"
      # 各 repo の mise.toml に入れさせないのは、版を repo ごとに持たせず、ここでそろえて上げるため
      - name: ワークフローとシェルスクリプトを actionlint・zizmor・shellcheck で検査する
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.*)$
          ACTIONLINT_VERSION: 1.7.12
          # renovate: datasource=github-releases depName=zizmorcore/zizmor extractVersion=^v(?<version>.*)$
          ZIZMOR_VERSION: 1.30.1
          # renovate: datasource=github-releases depName=koalaman/shellcheck extractVersion=^v(?<version>.*)$
          SHELLCHECK_VERSION: 0.11.0
        run: |
          shellcheck_tool="shellcheck@$SHELLCHECK_VERSION"
          # env の版を使わないのは、repo の mise.toml に shellcheck があれば、手元の lefthook と同じ版で検査するため
          if mise which shellcheck >/dev/null 2>&1; then
            shellcheck_tool=shellcheck
          fi
          git ls-files -z '*.sh' '*.bash' | xargs -0 -r mise exec "$shellcheck_tool" -- shellcheck
          dir=node_modules/dev-config/dist
          [ -d "$dir" ] || dir=dist
          actionlint_config=.github/actionlint.yaml
          [ -f "$actionlint_config" ] || actionlint_config=$dir/actionlint.yaml
          zizmor_config=.github/zizmor.yml
          [ -f "$zizmor_config" ] || zizmor_config=$dir/zizmor.yml
          # runner の shellcheck を使わせないのは、版が runner の image で変わり、repo によって結果が変わるため
          mise exec "$shellcheck_tool" "actionlint@$ACTIONLINT_VERSION" -- actionlint -config-file "$actionlint_config"
          mise exec "zizmor@$ZIZMOR_VERSION" -- zizmor --offline --min-severity low --config "$zizmor_config" .github/workflows
      - run: bun run validate
