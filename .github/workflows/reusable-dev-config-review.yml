name: dev-config review (reusable)

on:
  workflow_call:

jobs:
  review:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          experimental: true
      - run: bun install --frozen-lockfile
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.ORG_CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            この repo の設定のうち、takudev-works/dev-config の正本と重なっているものを消す PR を出してください。

            1. 同じ目的の PR がすでに開いていないかを `gh pr list --search "dev-config と重なる設定を消す in:title" --state open` で確かめる。開いていれば何もせずに終わる
            2. 正本を読む。dev-config は、この repo が使っている版が `node_modules/dev-config` にある（README.md に各ファイルの役割がある）。Renovate の preset は `node_modules/dev-config/renovate/default.json` にある
            3. この repo の設定のうち、正本と同じ内容をもう一度書いているものを探す。例:
               - `cspell.json` の `words` や `ignorePaths` のうち、`node_modules/dev-config/base.cspell.json` にあるもの
               - `eslint.config.*` の除外のうち、`node_modules/dev-config/base.eslint.config.mjs` にあるもの
               - `.secretlintignore` の行のうち、`node_modules/dev-config/base.secretlintignore` にあるもの（repo が独自の `.secretlintignore` を持つときだけ）
               - `renovate.json` の設定や `packageRules` のうち、`node_modules/dev-config/renovate/default.json` にあるもの
               - `.github/workflows/` の手順のうち、dev-config の再利用できるワークフロー（`reusable-*.yml`）で置き換えられるもの
            4. 重なっているものだけを消す。repo だけの事情で書いているもの、正本と値が違うものは残す。判断に迷うものは消さず、PR の本文に「確かめてほしいこと」として書く
            5. `bun run validate` が通ることを確かめる
            6. 消したものがあれば、`chore/dev-config-duplicates-<日付>` のブランチを作ってコミットし、既定のブランチに向けて PR を 1 本出す。題名は「chore: dev-config と重なる設定を消す」。本文には、消したものごとに、正本のどのファイルのどこと重なっていたかを書く
            7. 消すものがなければ、PR を作らずに終わる

            守ること:
            - repo の CLAUDE.md があれば従う
            - コミットメッセージと PR の題名は Conventional Commits の形で、日本語で書く
            - 既定のブランチに直接 push しない
            - 設定を消す以外の変更（新しい設定を足す、版を上げるなど）はしない
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(base64:*),Bash(bun run validate*),Bash(bun install*)"
