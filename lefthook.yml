glob_matcher: doublestar

commit-msg:
  commands:
    commitlint:
      run: bun commitlint --config src/commitlintrc.json --edit {1}

pre-commit:
  parallel: true
  commands:
    markdownlint:
      glob: '**/*.md'
      run: bun markdownlint-cli2 --config src/markdownlint-cli2.jsonc {staged_files}
    textlint:
      glob: '**/*.md'
      run: bun textlint --config src/textlintrc.json --ignore-path src/textlintignore {staged_files}
    eslint:
      glob: '**/*.{js,mjs,cjs,ts,tsx}'
      run: bun eslint {staged_files}
    prettier:
      run: bun prettier --check --ignore-unknown {staged_files}
    cspell:
      run: bun cspell --no-progress --no-summary --no-must-find-files {staged_files}
    secretlint:
      run: bun secretlint --secretlintrc src/secretlintrc.json --secretlintignore src/secretlintignore {staged_files}
    package-json:
      glob: '**/package.json'
      run: bun run validate:package-json
