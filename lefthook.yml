glob_matcher: doublestar

commit-msg:
  commands:
    commitlint:
      run: bun dist/cli.mjs commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    markdownlint:
      glob: '**/*.md'
      run: bun dist/cli.mjs markdownlint {staged_files}
    textlint:
      glob: '**/*.md'
      run: bun dist/cli.mjs textlint {staged_files}
    eslint:
      glob: '**/*.{js,mjs,cjs,ts,mts,cts,tsx}'
      run: bun eslint --no-warn-ignored {staged_files}
    prettier:
      run: bun prettier --check --ignore-unknown {staged_files}
    cspell:
      run: bun cspell --no-progress --no-summary --no-must-find-files {staged_files}
    secretlint:
      run: bun dist/cli.mjs secretlint {staged_files}
    package-json:
      glob: '**/package.json'
      run: bun run validate:package-json
    build:
      glob: 'src/**'
      run: bun run validate:build
